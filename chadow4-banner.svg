<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Chadow4 cyber security banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02030a"/>
      <stop offset=".48" stop-color="#080b1c"/>
      <stop offset="1" stop-color="#030914"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5ff"/>
      <stop offset=".5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ff00c8"/>
    </linearGradient>
    <radialGradient id="orb">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#00f5ff" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H1200" stroke="#fff" stroke-opacity=".025"/>
    </pattern>
    <linearGradient id="scanner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00f5ff" stop-opacity="0"/>
      <stop offset=".45" stop-color="#00f5ff" stop-opacity=".08"/>
      <stop offset=".5" stop-color="#00f5ff" stop-opacity=".85"/>
      <stop offset=".55" stop-color="#00f5ff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#00f5ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <clipPath id="frame"><rect x="22" y="22" width="1156" height="376" rx="20"/></clipPath>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <g clip-path="url(#frame)">
    <rect x="22" y="22" width="1156" height="376" fill="url(#grid)"/>
    <circle cx="220" cy="200" r="270" fill="url(#orb)" filter="url(#soft)"/>
    <circle cx="1020" cy="90" r="210" fill="#00f5ff" opacity=".07" filter="url(#soft)"/>
    <path d="M0 330L250 205 410 270 670 90 825 195 1200 40" fill="none" stroke="url(#neon)" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="14 12">
      <animate attributeName="stroke-dashoffset" from="0" to="-260" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M0 355L250 230 410 295 670 115 825 220 1200 65" fill="none" stroke="url(#neon)" stroke-opacity=".08" stroke-width="18" filter="url(#glow)"/>
    <g fill="#00f5ff" filter="url(#glow)">
      <circle cx="250" cy="205" r="4">
        <animate attributeName="r" values="3;7;3" dur="2.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".4;1;.4" dur="2.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="410" cy="270" r="4">
        <animate attributeName="r" values="3;7;3" dur="2.7s" begin=".4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".4;1;.4" dur="2.7s" begin=".4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="670" cy="90" r="4">
        <animate attributeName="r" values="3;7;3" dur="1.9s" begin=".8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".4;1;.4" dur="1.9s" begin=".8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="825" cy="195" r="4">
        <animate attributeName="r" values="3;7;3" dur="2.4s" begin="1.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".4;1;.4" dur="2.4s" begin="1.1s" repeatCount="indefinite"/>
      </circle>
    </g>
    <circle r="5" fill="#fff" filter="url(#glow)">
      <animateMotion dur="6s" repeatCount="indefinite" path="M0 330L250 205 410 270 670 90 825 195 1200 40"/>
    </circle>
    <circle r="3" fill="#ff00c8" filter="url(#glow)">
      <animateMotion dur="9s" begin="-3s" repeatCount="indefinite" path="M0 330L250 205 410 270 670 90 825 195 1200 40"/>
    </circle>
    <rect x="22" y="-70" width="1156" height="95" fill="url(#scanner)" opacity=".7">
      <animate attributeName="y" values="-70;420" dur="4.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="22" y="22" width="1156" height="376" fill="url(#scan)"/>
  </g>

  <rect x="22" y="22" width="1156" height="376" rx="20" fill="none" stroke="url(#neon)" stroke-opacity=".55"/>
  <path d="M22 82V42a20 20 0 0120-20h70M1088 22h70a20 20 0 0120 20v40M22 338v40a20 20 0 0020 20h70M1088 398h70a20 20 0 0020-20v-40" fill="none" stroke="#00f5ff" stroke-width="3" filter="url(#glow)">
    <animate attributeName="stroke-opacity" values=".45;1;.45" dur="2.8s" repeatCount="indefinite"/>
  </path>

  <g font-family="'Courier New',monospace">
    <text x="70" y="78" fill="#00f5ff" font-size="15" letter-spacing="3">SECURE CHANNEL // 0xC4</text>
    <text x="1130" y="78" fill="#8b949e" font-size="13" text-anchor="end">FR // ONLINE
      <animate attributeName="fill" values="#8b949e;#00f5ff;#8b949e" dur="2s" repeatCount="indefinite"/>
    </text>

    <text x="596" y="205" fill="#00f5ff" opacity="0" font-size="108" font-weight="900" letter-spacing="15" text-anchor="middle">CHADOW4
      <animate attributeName="opacity" values="0;0;.7;0;0;0" keyTimes="0;.84;.86;.89;.92;1" dur="5.2s" repeatCount="indefinite"/>
      <animate attributeName="x" values="596;596;585;606;596;596" keyTimes="0;.84;.86;.89;.92;1" dur="5.2s" repeatCount="indefinite"/>
    </text>
    <text x="604" y="205" fill="#ff00c8" opacity="0" font-size="108" font-weight="900" letter-spacing="15" text-anchor="middle">CHADOW4
      <animate attributeName="opacity" values="0;0;.7;0;0;0" keyTimes="0;.84;.86;.89;.92;1" dur="5.2s" repeatCount="indefinite"/>
      <animate attributeName="x" values="604;604;617;594;604;604" keyTimes="0;.84;.86;.89;.92;1" dur="5.2s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="205" fill="url(#neon)" font-size="108" font-weight="900" letter-spacing="15" text-anchor="middle" filter="url(#glow)">CHADOW4
      <animate attributeName="opacity" values=".72;1;.72" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="205" fill="#fff" font-size="108" font-weight="900" letter-spacing="15" text-anchor="middle">CHADOW4</text>
    <text x="600" y="252" fill="#a9b1d6" font-size="18" letter-spacing="7" text-anchor="middle">OFFENSIVE SECURITY × FULL-STACK ENGINEERING</text>

    <g font-size="13">
      <rect x="275" y="292" width="185" height="34" rx="17" fill="#00f5ff" fill-opacity=".08" stroke="#00f5ff" stroke-opacity=".5"/>
      <text x="367" y="314" fill="#00f5ff" text-anchor="middle">THINK // EXPLOIT</text>
      <rect x="475" y="292" width="250" height="34" rx="17" fill="#8b5cf6" fill-opacity=".1" stroke="#8b5cf6" stroke-opacity=".6"/>
      <text x="600" y="314" fill="#c4b5fd" text-anchor="middle">UNDERSTAND // BUILD</text>
      <rect x="740" y="292" width="185" height="34" rx="17" fill="#ff00c8" fill-opacity=".08" stroke="#ff00c8" stroke-opacity=".5"/>
      <text x="832" y="314" fill="#ff63dc" text-anchor="middle">PATCH // REPEAT</text>
    </g>

    <text x="70" y="365" fill="#4b5563" font-size="12">SYS.STATUS: OPERATIONAL
      <animate attributeName="opacity" values="1;.45;1" dur="1.4s" repeatCount="indefinite"/>
    </text>
    <text x="1130" y="365" fill="#4b5563" font-size="12" text-anchor="end">BUILD 04.∞</text>
  </g>
</svg>
